<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLR Match Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 0.9em;
        }
        
        .teams-container {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .team-select {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.9em;
        }
        
        select {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select:hover {
            border-color: #667eea;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .vs {
            font-size: 1.5em;
            font-weight: bold;
            color: #a0aec0;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .results {
            margin-top: 30px;
            padding: 30px;
            background: #f7fafc;
            border-radius: 12px;
            display: none;
        }
        
        .results.show {
            display: block;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .prediction-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .winner {
            font-size: 1.8em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 5px;
        }
        
        .confidence {
            color: #718096;
            font-size: 0.9em;
        }
        
        .teams-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .team-card {
            padding: 20px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }
        
        .team-card.winner-card {
            border-color: #48bb78;
            background: #f0fff4;
        }
        
        .team-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
        }
        
        .probability {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .team-stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.9em;
            color: #4a5568;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
        }
        
        .stat-label {
            font-weight: 600;
        }
        
        .warning {
            margin-top: 15px;
            padding: 10px;
            background: #fff5f5;
            border: 1px solid #fc8181;
            border-radius: 6px;
            color: #c53030;
            font-size: 0.85em;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #718096;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #a0aec0;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ VLR Match Predictor</h1>
        <p class="subtitle">Predict Valorant professional match outcomes using machine learning</p>
        
        <div class="teams-container">
            <div class="team-select">
                <label for="team1">Team 1</label>
                <select id="team1">
                    <option value="">Select Team 1...</option>
                    {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="vs">VS</div>
            
            <div class="team-select">
                <label for="team2">Team 2</label>
                <select id="team2">
                    <option value="">Select Team 2...</option>
                    {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <button id="predictBtn" onclick="predict()">Predict Match Outcome</button>
        
        <div id="results" class="results">
            <div class="prediction-header">
                <div class="winner" id="winner"></div>
                <div class="confidence" id="confidence"></div>
            </div>
            
            <div class="teams-comparison">
                <div class="team-card" id="team1-card">
                    <div class="team-name" id="team1-name"></div>
                    <div class="probability" id="team1-prob"></div>
                    <div class="team-stats">
                        <div class="stat-row">
                            <span class="stat-label">Rank:</span>
                            <span id="team1-rank"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Win Rate:</span>
                            <span id="team1-winrate"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Total Games:</span>
                            <span id="team1-games"></span>
                        </div>
                    </div>
                </div>
                
                <div class="team-card" id="team2-card">
                    <div class="team-name" id="team2-name"></div>
                    <div class="probability" id="team2-prob"></div>
                    <div class="team-stats">
                        <div class="stat-row">
                            <span class="stat-label">Rank:</span>
                            <span id="team2-rank"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Win Rate:</span>
                            <span id="team2-winrate"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Total Games:</span>
                            <span id="team2-games"></span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="warning" class="warning" style="display: none;"></div>
        </div>
        
        <div class="footer">
            Model Accuracy: ~59-68% | Trained on 422 VCT matches | Built with XGBoost & Flask
        </div>
    </div>
    
    <script>
        async function predict() {
            const team1 = document.getElementById('team1').value;
            const team2 = document.getElementById('team2').value;
            const resultsDiv = document.getElementById('results');
            const predictBtn = document.getElementById('predictBtn');
            
            if (!team1 || !team2) {
                alert('Please select both teams');
                return;
            }
            
            if (team1 === team2) {
                alert('Please select different teams');
                return;
            }
            
            // Show loading
            predictBtn.disabled = true;
            predictBtn.textContent = 'Predicting...';
            resultsDiv.classList.remove('show');
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ team1, team2 })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResults(data);
                } else {
                    alert(data.error || 'Prediction failed');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                predictBtn.disabled = false;
                predictBtn.textContent = 'Predict Match Outcome';
            }
        }
        
        function displayResults(data) {
            // Update winner
            const winnerName = data.prediction === 'team1' ? data.team1.name : data.team2.name;
            document.getElementById('winner').textContent = `${winnerName} predicted to win`;
            document.getElementById('confidence').textContent = `${data.confidence.toFixed(1)}% confidence`;
            
            // Update Team 1
            document.getElementById('team1-name').textContent = data.team1.name;
            document.getElementById('team1-prob').textContent = `${data.team1.win_probability.toFixed(1)}%`;
            document.getElementById('team1-rank').textContent = data.team1.rank === 999 ? 'Unranked' : `#${data.team1.rank}`;
            document.getElementById('team1-winrate').textContent = data.team1.win_rate;
            document.getElementById('team1-games').textContent = data.team1.total_games;
            
            // Update Team 2
            document.getElementById('team2-name').textContent = data.team2.name;
            document.getElementById('team2-prob').textContent = `${data.team2.win_probability.toFixed(1)}%`;
            document.getElementById('team2-rank').textContent = data.team2.rank === 999 ? 'Unranked' : `#${data.team2.rank}`;
            document.getElementById('team2-winrate').textContent = data.team2.win_rate;
            document.getElementById('team2-games').textContent = data.team2.total_games;
            
            // Highlight winner
            const team1Card = document.getElementById('team1-card');
            const team2Card = document.getElementById('team2-card');
            team1Card.classList.remove('winner-card');
            team2Card.classList.remove('winner-card');
            
            if (data.prediction === 'team1') {
                team1Card.classList.add('winner-card');
            } else {
                team2Card.classList.add('winner-card');
            }
            
            // Show warning if teams not found
            const warningDiv = document.getElementById('warning');
            if (!data.team1.found || !data.team2.found) {
                let msg = 'Warning: ';
                if (!data.team1.found && !data.team2.found) {
                    msg += 'Both teams not found in rankings. Prediction may be inaccurate.';
                } else if (!data.team1.found) {
                    msg += `${data.team1.name} not found in rankings. Prediction may be inaccurate.`;
                } else {
                    msg += `${data.team2.name} not found in rankings. Prediction may be inaccurate.`;
                }
                warningDiv.textContent = msg;
                warningDiv.style.display = 'block';
            } else {
                warningDiv.style.display = 'none';
            }
            
            // Show results
            document.getElementById('results').classList.add('show');
        }
    </script>
</body>
</html>
